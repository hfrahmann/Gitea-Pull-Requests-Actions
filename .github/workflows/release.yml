# Builds the release version and creates the GitHub/Gitea release v<pluginVersion> with the plugin zip.
# Manual only. Version from pluginVersion in gradle.properties, release notes from its CHANGELOG.md section.
# Runs on GitHub Actions and on Gitea Actions (see build.yml); the release goes through the REST API
# (.github/scripts/create-release.sh), not a GitHub-only action.
# Optionally uploads the plugin to the JetBrains Marketplace (publishPlugin). Secrets: PUBLISH_TOKEN (Marketplace →
# My Tokens), optionally CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD for signing. Plugin page:
# https://plugins.jetbrains.com/plugin/35606-gitea-pull-requests--actions – uploads are moderated before they go public.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      publish:
        description: Publish the plugin to the JetBrains Marketplace
        type: boolean
        default: false
      hidden:
        description: Marketplace only - keep the version hidden after the review until it is released by hand
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read version
        id: version
        run: |
          version=$(sed -nE 's/^pluginVersion *= *([^ ]+) *$/\1/p' gradle.properties)
          if [ -z "$version" ]; then
            echo "pluginVersion not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}"

      # The same checks as the Build workflow, then the zip and the change notes of this version
      - name: Build release
        run: |
          ./gradlew build buildPlugin --console=plain
          ./gradlew getChangelog --project-version=${{ steps.version.outputs.version }} --no-header --no-links \
            --output-file=build/release-notes.md --console=plain

      - name: Create release
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/create-release.sh "${{ steps.version.outputs.version }}" build/release-notes.md \
            build/distributions/*-${{ steps.version.outputs.version }}.zip \
            ${{ inputs.draft }} ${{ inputs.prerelease }}

      # Signs the zip when the signing secrets are set, then uploads it (see intellijPlatform.signing/publishing)
      - name: Publish to JetBrains Marketplace
        if: ${{ inputs.publish }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "Secret PUBLISH_TOKEN is not set" >&2
            exit 1
          fi
          ./gradlew publishPlugin -PpublishHidden=${{ inputs.hidden }} --console=plain
