pluginGroup = de.hendrikfrahmann.giteaplugin
pluginName = Gitea Pull Requests & Actions
pluginVersion = 1.0.1

# IDE the plugin is compiled against = lowest supported major (sinceBuild)
platformVersion = 2026.1.5
pluginSinceBuild = 261

# The IDE provides kotlin-stdlib and kotlinx-coroutines - never bundle them
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -Dfile.encoding=UTF-8
